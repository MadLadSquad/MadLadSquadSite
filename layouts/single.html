{{ define "main" }}
		{{- with .Params.sidebar }}
		<div class="docs-layout">
			<details class="docs-nav" open>
				<summary>Contents</summary>
				<nav aria-label="Documentation">
{{ $.RenderString . }}
				</nav>
			</details>
			<main>
				<nav class="breadcrumbs" aria-label="Breadcrumb">
					<a href="{{ partial "link.html" "/docs/docs" }}" class="breadcrumb-back">
						<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg>
						All docs
					</a>
					{{- with $.Params.project }}
					<span aria-hidden="true">/</span>
					<a href="{{ partial "link.html" (printf "/docs/%s/Home" .) }}">{{ . }}</a>
					{{- end }}
				</nav>
{{ $.Content }}
			</main>
		</div>
		{{- else }}
		<main>
{{ .Content }}
		</main>
		{{- end }}
{{ end }}
