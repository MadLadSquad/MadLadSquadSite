<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<!-- Primary meta -->
<meta name="description" content="MadLadSquad is a decentralised team of developers building open-source software: the UntitledDesktopEnvironment, moddable games, cross-platform C/C++ developer libraries and multilingual tools for Linux, Unix and Windows."/>
<meta name="keywords" content="MadLadSquad, open source, programming, Linux, Unix, Windows, X11, Wayland, UntitledDesktop, UntitledDesktopEnvironment, UDE, dear imgui, game development, C++, GitHub"/>
<meta name="author" content="MadLadSquad"/>
<meta name="robots" content="index, follow"/>
<meta name="theme-color" content="#333333"/>

{{ hugo.Generator }}

<!-- Open Graph (og:title is set per-page in template.html) -->
<meta property="og:locale" content="en_US"/>
<meta property="og:site_name" content="MadLadSquad"/>
<meta property="og:type" content="website"/>
<meta property="og:description" content="A decentralised team of developers building open-source software: the UntitledDesktopEnvironment, moddable games, cross-platform C/C++ libraries and multilingual tools."/>
<meta property="og:image" content="{{ "logo.png" | absURL }}"/>
<meta property="og:image:width" content="460"/>
<meta property="og:image:height" content="460"/>
<meta property="og:image:alt" content="MadLadSquad logo"/>

<!-- Twitter (twitter:title is set per-page in template.html) -->
<meta name="twitter:card" content="summary"/>
<meta name="twitter:description" content="A decentralised team of developers building open-source software: the UntitledDesktopEnvironment, moddable games, cross-platform C/C++ libraries and multilingual tools."/>
<meta name="twitter:image" content="{{ "logo.png" | absURL }}"/>
<meta name="twitter:image:alt" content="MadLadSquad logo"/>

<link rel="icon" type="image/png" href="/favicon.png"/>
<link rel="apple-touch-icon" href="/favicon.png"/>

{{ with resources.Get "fonts.css" | css.Build (dict "minify" true "targetPath" "fonts/fonts.css") }}<link rel="stylesheet" href="{{ .RelPermalink }}"/>{{ end }}
{{ with resources.Get "main.css" | css.Build (dict "minify" true "targetPath" "main.css") }}<link rel="stylesheet" href="{{ .RelPermalink }}"/>{{ end }}
